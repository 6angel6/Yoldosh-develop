stages:
  - deploy
  - notify

variables:
  NODE_ENV: "production"

# ========================
# DEPLOY TO PRODUCTION
# ========================
deploy_production:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_PROD" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$PROD_SERVER_IP" >> ~/.ssh/known_hosts

  script:
    - echo "🚀 Deploying to PRODUCTION server..."
    - |
      ssh "$PROD_SERVER_USER@$PROD_SERVER_IP" /bin/bash <<EOF
        set -e

        cd /home/yoldosh/Yoldosh

        echo "📡 Current remote URL:"
        git remote -v

        echo "📡 Setting up authenticated Git URL..."
        git remote set-url origin "https://$DEPLOY_TOKEN_USERNAME:$DEPLOY_TOKEN_PASSWORD@gitlab.com/brakhmonovYoldosh/Yoldosh.git"

        echo "📥 Fetching latest changes..."
        git fetch origin prod --verbose

        echo "📊 Current commit:"
        git log -1 --oneline

        echo "🔄 Resetting to origin/prod..."
        git reset --hard origin/prod

        echo "📊 New commit:"
        git log -1 --oneline

        echo "🧹 Cleaning up remote URL..."
        git remote set-url origin "https://gitlab.com/brakhmonovYoldosh/Yoldosh.git"

        echo "🐳 Rebuilding containers..."
        docker compose down
        docker compose up -d --build --force-recreate

        sleep 10
        docker compose ps
    - echo "✅ Deployed to PRODUCTION successfully"

  environment:
    name: production
    url: https://api.yoldosh.uz

  only:
    - prod

# ========================
# STAGE: NOTIFY (Telegram)
# ========================
notify_success:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      COMMIT_MESSAGE=$(echo "$CI_COMMIT_MESSAGE" | head -n 1)
      MESSAGE="✅ <b>Деплой успешен!</b>%0A%0A<b>Проект:</b> Yoldosh Backend%0A<b>Ветка:</b> $CI_COMMIT_REF_NAME%0A<b>Коммит:</b> $CI_COMMIT_SHORT_SHA%0A<b>Автор:</b> $GITLAB_USER_NAME%0A<b>Сообщение:</b> $COMMIT_MESSAGE%0A<b>Pipeline:</b> #$CI_PIPELINE_ID%0A<b>Окружение:</b> ${CI_COMMIT_REF_NAME}%0A%0A🔗 <a href=\"$CI_PIPELINE_URL\">Посмотреть pipeline</a>"
      curl -s -X POST "https://api.telegram.org/bot8425121542:AAE5ZjeODiJU0KHN005rd5sTbjMSQNGGLe4/sendMessage" \
        -d chat_id=-1002819521339 \
        -d text="${MESSAGE}" \
        -d parse_mode="HTML"
  only:
    - develop
    - prod
  when: on_success

notify_failure:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      COMMIT_MESSAGE=$(echo "$CI_COMMIT_MESSAGE" | head -n 1)
      MESSAGE="❌ <b>Деплой провален!</b>%0A%0A<b>Проект:</b> Yoldosh Backend%0A<b>Ветка:</b> $CI_COMMIT_REF_NAME%0A<b>Коммит:</b> $CI_COMMIT_SHORT_SHA%0A<b>Автор:</b> $GITLAB_USER_NAME%0A<b>Сообщение:</b> $COMMIT_MESSAGE%0A<b>Pipeline:</b> #$CI_PIPELINE_ID%0A<b>Окружение:</b> ${CI_COMMIT_REF_NAME}%0A%0A🔗 <a href=\"$CI_PIPELINE_URL\">Посмотреть ошибки</a>"
      curl -s -X POST "https://api.telegram.org/bot8425121542:AAE5ZjeODiJU0KHN005rd5sTbjMSQNGGLe4/sendMessage" \
        -d chat_id=-1002819521339 \
        -d text="${MESSAGE}" \
        -d parse_mode="HTML"
  only:
    - develop
    - prod
  when: on_failure
  