  /trip/{tripId}/bookings:
    get:
      tags: [Trip]
      summary: Get all bookings for a trip (driver only)
      description: Retrieves all bookings for a specific trip. Driver can filter by status (e.g., PENDING, CONFIRMED, CANCELLED)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, CONFIRMED, CANCELLED, FAILED]
          description: Filter bookings by status
      responses:
        '200':
          description: Trip bookings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      bookings:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            passengerId:
                              type: string
                              format: uuid
                            passenger:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                firstName:
                                  type: string
                                lastName:
                                  type: string
                                avatar:
                                  type: string
                                phoneNumber:
                                  type: string
                            seatsBooked:
                              type: integer
                            totalPrice:
                              type: number
                            status:
                              type: string
                              enum: [PENDING, CONFIRMED, CANCELLED, FAILED]
                            pickup_latitude:
                              type: number
                            pickup_longitude:
                              type: number
                            dropoff_latitude:
                              type: number
                            dropoff_longitude:
                              type: number
                            from_address:
                              type: string
                            to_address:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

