  # ===================== TRIP ADDITIONAL ENDPOINTS =====================
  /trip/req-price:
    get:
      tags: [Trip]
      summary: Get price recommendation for a specific route
      description: |
        Get price recommendation based on historical data for completed trips
        between specified cities. Pass full addresses (e.g. from Yandex Maps) —
        the city is extracted automatically from the address string.
        Returns min/max/average prices with confidence level.
        No authentication required.
      parameters:
        - name: from_address
          in: query
          required: true
          schema:
            type: string
            example: "Россия, Ташкент, улица Навои, 5"
          description: Full departure address. City is extracted automatically.
        - name: to_address
          in: query
          required: true
          schema:
            type: string
            example: "Узбекистан, Самарканд, проспект Амира Темура, 12"
          description: Full destination address. City is extracted automatically.
      responses:
        '200':
          description: Price recommendation retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      recommended_min:
                        type: number
                        nullable: true
                        example: 50000
                        description: Minimum recommended price (15th percentile)
                      recommended_max:
                        type: number
                        nullable: true
                        example: 85000
                        description: Maximum recommended price (85th percentile)
                      average_price:
                        type: number
                        nullable: true
                        example: 67000
                        description: Average price from analyzed trips
                      trips_analyzed:
                        type: integer
                        example: 42
                        description: Number of completed trips analyzed for this route
                      confidence:
                        type: string
                        enum: [high, medium, low, insufficient_data]
                        example: high
                        description: |
                          Confidence level based on sample size:
                          - high: 30+ trips
                          - medium: 10-29 trips
                          - low: 5-9 trips
                          - insufficient_data: less than 5 trips (prices will be null)
                      from_city:
                        type: string
                        nullable: true
                        example: Tashkent
                        description: City extracted from from_address
                      to_city:
                        type: string
                        nullable: true
                        example: Samarkand
                        description: City extracted from to_address
                      error:
                        type: string
                        nullable: true
                        example: "Could not extract city from from_address"
                        description: Present only when city extraction fails
                  message:
                    type: string
                    example: Success
        '400':
          description: Validation error - missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation failed. Please provide from_city and to_city.
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string

  /trip/{tripId}/report:
    post:
      tags: [Trip]
      summary: Report trip
      security:
