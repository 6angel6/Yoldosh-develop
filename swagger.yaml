  # ===================== PARCEL ENDPOINTS (MVP) =====================
  /parcel:
    post:
      tags: [Parcel]
      summary: Create parcel delivery request
      description: |
        Point A → point B parcel delivery on a trip where the driver enabled
        `parcels_allowed` (Yandex-Delivery-style: nothing is known about the
        parcel itself). Behaves like a booking: on INSTANT trips the parcel is
        CONFIRMED immediately, on REQUEST trips it is created as PENDING and
        waits for the driver. Parcels do NOT occupy seats.
        Price = trip.parcel_price, or trip.price_per_person when parcel_price is null.
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateParcel'
      responses:
        '201':
          description: Parcel created (CONFIRMED on INSTANT trips, PENDING on REQUEST trips)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      parcel:
                        $ref: '#/components/schemas/Parcel'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /parcel/my:
    get:
      tags: [Parcel]
      summary: Get my parcels (sender)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Parcels retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Parcel'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /parcel/trip/{tripId}:
    get:
      tags: [Parcel]
      summary: Get trip parcels (driver only)
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ParcelStatus'
          description: Filter by parcel status
      responses:
        '200':
          description: Trip parcels retrieved
