  /parcel/{parcelId}/cancel:
    patch:
      tags: [Parcel]
      summary: Cancel parcel (sender)
      description: Allowed while the parcel is PENDING or CONFIRMED (not yet picked up).
      security:
        - BearerAuth: []
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            type: string
