        '401':
          $ref: '#/components/responses/Unauthorized'

  /card/getAllUsersCards:
    get:
      tags: [User-Cards]
      summary: Get user cards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User cards retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
