      responses:
        '201':
          $ref: '#/components/responses/CreatedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /car/my-cars:
    get:
      tags: [Car]
      summary: Get my cars
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cars retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Car'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /car/{carId}:
    get:
      tags: [Car]
      summary: Get car by ID
      parameters:
        - name: carId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Car retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Car'
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Car]
      summary: Update car
      security:
        - BearerAuth: []
      parameters:
        - name: carId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Car]
      summary: Delete car
      security:
        - BearerAuth: []
      parameters:
        - name: carId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== TRIP ENDPOINTS =====================
  /trip:
    post:
      tags: [Trip]
      summary: Create trip
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateTrip'
      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      trip:
                        $ref: '#/components/schemas/Trip'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trip/search:
    get:
      tags: [Trip]
      summary: Search trips with filters and sorting
      description: |
        Search for trips by location, date, and apply optional filters and sorting.
        
        **Sorting**: You can sort by either price OR time, not both at the same time.
        - `sort_by_price`: cheapest | expensive
        - `sort_by_time`: earliest | latest
        
        **Filters**: All filter parameters are optional.
      security:
        - BearerAuth: []
      parameters:
        - name: from_latitude
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Departure latitude coordinate
          example: 41.322550
        - name: from_longitude
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Departure longitude coordinate
          example: 69.280380
        - name: to_latitude
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Arrival latitude coordinate
          example: 39.651766
        - name: to_longitude
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Arrival longitude coordinate
          example: 66.951389
        - name: departure_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Departure date in ISO 8601 format (must be in the future)
          example: '2026-01-15T00:00:00Z'
        - name: requested_seats
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Number of seats requested (default 1)
        - name: sort_by_price
          in: query
          required: false
          schema:
            type: string
            enum: [cheapest, expensive]
          description: Sort trips by price
        - name: sort_by_time
          in: query
          required: false
          schema:
            type: string
            enum: [earliest, latest]
          description: Sort trips by departure time (cannot be used with sort_by_price)
        - name: conditioner
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by air conditioning availability
        - name: smoking_allowed
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by smoking policy
        - name: door_pickup
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by door-to-door pickup service
        - name: food_stop
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by food stop availability
        - name: garage
          in: query
          required: false
          schema:
            type: string
            enum: [FULL, EMPTY, HALF_EMPTY]
          description: Filter by garage/trunk space availability
        - name: parcels_allowed
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          description: 'true: only trips where the driver accepts parcels (parcel delivery search)'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Trips found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      trips:
