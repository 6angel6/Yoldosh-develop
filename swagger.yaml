  # ===================== BOOKING ADDITIONAL ENDPOINTS =====================

  /booking/{bookingId}/confirm:
    post:
      tags: [Booking]
      summary: Confirm REQUEST booking (driver only)
      description: |
        Driver confirms a PENDING booking request. This action:
        - Changes booking status from PENDING to CONFIRMED
        - Applies promocode discount if passenger has an active one
        - Decrements available seats on the trip
        - Sends confirmation notification to passenger with final price
        
        Only works for bookings with status PENDING from REQUEST type trips.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking confirmed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Booking confirmed successfully
                  data:
                    type: object
                    properties:
                      booking:
                        $ref: '#/components/schemas/Booking'
                      promoCodeApplied:
                        type: boolean
                        description: Whether a promocode discount was applied
                      finalPrice:
                        type: number
                        description: Final price after promocode discount (if applied)
                        example: 49500
        '400':
          description: Bad request - booking not in PENDING status or validation failed
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - user is not the driver of this trip
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Booking or trip not found
          $ref: '#/components/responses/NotFound'

  /booking/{bookingId}/reject:
    post:
      tags: [Booking]
      summary: Reject REQUEST booking (driver only)
      description: |
        Driver rejects a PENDING booking request. This action:
        - Changes booking status from PENDING to CANCELLED
        - Preserves passenger's promocode for future use
        - Does NOT affect trip seats (they were never decremented)
        - Sends rejection notification to passenger with optional reason
        
        Only works for bookings with status PENDING from REQUEST type trips.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
                  description: Optional reason for rejection (shown to passenger)
                  example: Sorry, I need to cancel this trip
      responses:
        '200':
          description: Booking rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Booking rejected successfully
                  data:
                    type: object
                    properties:
                      booking:
                        $ref: '#/components/schemas/Booking'
        '400':
          description: Bad request - booking not in PENDING status
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - user is not the driver of this trip
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Booking or trip not found
          $ref: '#/components/responses/NotFound'

  /booking/{bookingId}/cancel:
    patch:
      tags: [Booking]
      summary: Cancel booking with refund
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancellationReason]
              properties:
                cancellationReason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Booking cancelled and funds returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Booking cancelled successfully, funds returned.
                  data:
                    type: object
                    properties:
                      bookingId:
                        type: string
                        format: uuid
                      refundDetails:
                        type: object
                        properties:
                          amount:
                            type: number
                            example: 110000
                          status:
                            type: string
                            example: 'COMPLETED'
                          type:
                            type: string
                            enum: [WALLET, CARD]

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
