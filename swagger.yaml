                  format: date-time
                  description: New departure date and time
                seats_available:
                  type: integer
                  minimum: 1
                  description: Updated number of available seats
                price_per_person:
                  type: number
                  minimum: 0
                  description: Updated price per person
                max_two_back:
                  type: boolean
                  description: Maximum 2 passengers in back seat
                conditioner:
                  type: boolean
                  description: Air conditioning available
                smoking_allowed:
                  type: boolean
                  description: Smoking allowed during trip
                door_pickup:
                  type: boolean
                  description: Door-to-door pickup service
                food_stop:
                  type: boolean
                  description: Food stops allowed
                garage:
                  type: string
                  enum: [FULL, EMPTY, HALF_EMPTY]
                  description: Garage/trunk space availability
                booking_type:
                  type: string
                  enum: [INSTANT, REQUEST]
                  description: 'Booking confirmation type: INSTANT - automatic booking, REQUEST - requires driver approval'
