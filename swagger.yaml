  # ─────────────────────────────────────────────
  # INTERNAL — только для Python-парсера
  # ─────────────────────────────────────────────

  /internal/trips/import:
    post:
      tags: [Internal]
      summary: Импортировать поездку от Python-парсера
      description: |
        Принимает данные о поездке, спарсенные из Telegram.
        Backend автоматически:
        - создаёт аккаунт водителя (если не существует) с ролью Driver
        - создаёт машину (если не существует по govNumber)
        - создаёт Trip в статусе CREATED
        - геокодирует города через Nominatim (fallback — встроенная карта)

        Когда пассажир бронирует место на такой поездке, backend публикует событие
        в Redis-очередь `external-driver-notifications` (BullMQ).
        Python worker читает эту очередь и отправляет уведомление водителю в Telegram.

        **Защита**: заголовок `X-Internal-Key` должен совпадать с `INTERNAL_API_KEY` из `.env`.
      security:
        - InternalKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_city
                - to_city
                - phone
                - first_name
                - price
              properties:
                from_city:
                  type: string
                  example: Tashkent
                  description: Название города отправления (на любом языке)
                to_city:
                  type: string
                  example: Samarkand
                  description: Название города назначения (на любом языке)
                phone:
                  type: string
                  pattern: '^\+998[0-9]{9}$'
                  example: "+998901234567"
                first_name:
                  type: string
                  example: Ali
                last_name:
                  type: string
                  example: Aliev
                car_model:
                  type: string
                  example: Nexia 3
                car_make:
                  type: string
                  example: Chevrolet
                car_number:
                  type: string
                  example: 01A111AA
                price:
                  type: number
                  example: 100000
                  description: Цена за место в сумах
                seats_available:
                  type: integer
                  default: 3
                  example: 3
                baggage:
                  type: string
                  enum: [FULL, HALF_EMPTY, EMPTY]
                  example: EMPTY
                pick_up_from_home:
                  type: boolean
                  default: false
                food_stop:
                  type: boolean
                  default: false
                smoking:
                  type: boolean
                  default: false
                air_conditioner:
                  type: boolean
                  default: false
                departure_ts:
                  type: string
                  format: date-time
                  description: Время отправления UTC (если не указано — завтра 08:00 UZT)
                  example: "2026-03-28T03:00:00.000Z"
            example:
              from_city: Tashkent
              to_city: Samarkand
              phone: "+998901234567"
              first_name: Ali
              last_name: Aliev
              car_model: Nexia 3
              car_make: Chevrolet
              car_number: 01A111AA
              price: 100000
              seats_available: 3
              baggage: EMPTY
              pick_up_from_home: true
              food_stop: false
              smoking: false
              air_conditioner: true
      responses:
        '201':
          description: Поездка успешно создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      trip:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          from_city:
                            type: string
                          to_city:
                            type: string
                          price_per_person:
                            type: number
                          seats_available:
                            type: integer
                          departure_ts:
                            type: string
                            format: date-time
                          status:
                            type: string
                            enum: [CREATED]
                      driver:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          phone:
                            type: string
                          isNew:
                            type: boolean
                            description: true если аккаунт создан впервые
                      car:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          make:
                            type: string
                          model:
                            type: string
                          govNumber:
                            type: string
                  message:
                    type: string
                    example: Trip imported successfully.
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Validation failed.
                  errors:
                    type: object
        '401':
          description: Неверный или отсутствующий X-Internal-Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
        '500':
          description: Внутренняя ошибка (например, неизвестный город)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Unknown city: "Foo". Cannot determine coordinates.'

