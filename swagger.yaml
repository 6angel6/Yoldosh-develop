openapi: 3.0.0
info:
  title: 'Yoldosh API'
  version: '2.0-Geo'
  description: |
    Yoldosh - Ride-sharing platform API
servers:
  - url: 'https://api.yoldosh.uz/api/v1'
    description: Production server
  - url: 'https://test-api.yoldosh.uz/api/v1'
    description: Test server
  - url: 'http://localhost:5000/api/v1'
    description: Local server

tags:
  - name: Health
    description: Server health check
  - name: Auth
    description: Authentication and registration (3-step process)
  - name: User
    description: User profile management and preferences
  - name: User-Cards
    description: User payment cards (IPAK YOLI integration)
  - name: Car
    description: Car and driver verification
  - name: Trip
    description: Trip creation, search, updates, and management
  - name: Booking
    description: Booking management and payment
  - name: Payment
    description: Payment processing and callbacks
  - name: Wallet
    description: Wallet balance and transactions
  - name: Chat
    description: Chat and real-time messaging
  - name: Rating
    description: User ratings and reviews
  - name: Notification
    description: Push notifications management
  - name: Referral
    description: Referral programs and codes
  - name: Admin
    description: Admin panel operations
  - name: Internal
    description: Internal API для Python-парсера. Требует заголовок X-Internal-Key.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh-token
    InternalKeyAuth:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Секретный ключ для внутренних роутов. Задаётся через INTERNAL_API_KEY в .env

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User ID

    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Trip ID

    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Booking ID

    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Chat ID

    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
      description: Items per page

  schemas:
    # =============== RESPONSE WRAPPERS ===============
    SuccessResponse:
      type: object
      required:
        - success
        - status_code
        - message
      properties:
        success:
          type: boolean
          example: true
        status_code:
          type: integer
          example: 200
        message:
          type: string
          example: Success.
        data:
          type: object
          description: Response data (optional)

    ErrorResponse:
      type: object
      required:
        - success
        - status_code
        - message
      properties:
        success:
          type: boolean
          example: false
        status_code:
          type: integer
          example: 400
        message:
          type: string
          example: Validation failed.
        errors:
          type: array
          items:
            type: string
          description: Array of error messages (optional)

    # =============== ENUMS ===============
    Gender:
      type: string
      enum: [MALE, FEMALE, OTHER]

    UserRole:
      type: string
      enum: [Passenger, Driver]

    TripStatus:
      type: string
      enum: [CREATED, IN_PROGRESS, COMPLETED, CANCELED]

    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, FAILED, CANCELLED]

    CarStatus:
      type: string
      enum: [WAITING_MYID, PENDING, VERIFIED, REJECTED]

    TransactionType:
      type: string
      enum: [DEPOSIT, WITHDRAWAL, PAYMENT, REFUND, COMMISSION, TRANSFER]

    TransactionStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED, CANCELLED]

    PaymentProvider:
      type: string
      enum: [IPAK, PAYNET, CLICK, PAYME, OCTO, PLUM, NONE]

    PaymentStatus:
      type: string
      enum: [SUCCESS, PENDING, CREATED, FAILED, REVERSED]

    NavigatorPreference:
      type: string
      enum: [YANDEX_NAVI, GOOGLE_MAPS, NONE]
      description: User's preferred navigation app

    GarageStatus:
      type: string
      enum: [FULL, EMPTY, HALF_EMPTY]
      description: Driver's garage availability status

    BookingType:
      type: string
      enum: [INSTANT, REQUEST]
      description: |
        Booking type for trip:
        - INSTANT: Booking is confirmed immediately
        - REQUEST: Booking requires driver confirmation (PENDING status)

    # =============== USER SCHEMA ===============
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          maxLength: 32
        lastName:
          type: string
          maxLength: 32
          nullable: true
        phoneNumber:
          type: string
          pattern: '^\+998[0-9]{9}$'
        avatar:
          type: string
          nullable: true
        bio:
          type: string
          maxLength: 128
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        date_of__birthday:
          type: string
          format: date
          nullable: true
        rating:
          type: number
          format: double
          example: 4.5
        role:
          $ref: '#/components/schemas/UserRole'
        verified:
          type: boolean
        passport_verified:
          type: boolean
          nullable: true
        isBanned:
          type: boolean
        banExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Ban expiration date (if user is banned)
        banReason:
          type: string
          maxLength: 128
          nullable: true
          description: Reason for ban
        talkative:
          type: boolean
          nullable: true
          description: User prefers talkative drivers/passengers
        music_allowed:
          type: boolean
          nullable: true
          description: User is okay with music during trip
        pets_allowed:
          type: boolean
          nullable: true
          description: User prefers trips that allow pets
        preferred_navigator:
          $ref: '#/components/schemas/NavigatorPreference'
          description: User's preferred navigation app
        isHavePromocode:
          type: boolean
          description: Whether user has an active promocode
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        phoneNumber:
          type: string
        avatar:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        date_of__birthday:
          type: string
          format: date
          nullable: true
        rating:
          type: number
          format: double
        role:
          $ref: '#/components/schemas/UserRole'
        verified:
          type: boolean
        cars:
          type: array
          items:
            $ref: '#/components/schemas/Car'
        notificationPreferences:
          type: object
          properties:
            trips:
              type: boolean
            newsAndAgreement:
              type: boolean
            promotionAndDiscounts:
              type: boolean
            messages:
              type: boolean
            general:
              type: boolean

    # =============== CAR SCHEMA ===============
    Car:
      type: object
      properties:
        id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        make:
          type: string
          example: Chevrolet
        model:
          type: string
          example: Cobalt
        year:
          type: integer
          example: 2020
        plate_number:
          type: string
        seats_standard:
          type: integer
          example: 4
        color:
          type: string
        status:
          $ref: '#/components/schemas/CarStatus'
        passport_number:
          type: string
          nullable: true
        carPassportLink:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =============== TRIP SCHEMA ===============
    Coordinates:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    Location:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        region:
          type: object
          properties:
            id:
              type: integer
            nameRu:
              type: string
            nameUz:
              type: string
            nameEn:
              type: string

    PriceInfo:
      type: object
      properties:
        final_price:
          type: integer
          description: Total price including service fee
          example: 55000
        driver_base_price:
          type: integer
          description: Price set by driver
          example: 50000
        service_fee:
          type: integer
          description: 10% service fee
          example: 5000
        currency:
          type: string
          example: UZS
        promocode:
          type: object
          properties:
            discounted:
              type: integer
              nullable: true
            discount_percentage:
              type: integer
              example: 10
            has_active_promocode:
              type: boolean

    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        car_id:
          type: string
          format: uuid
        from_city:
          type: string
          description: Departure city name
        to_city:
          type: string
          description: Arrival city name
        from_latitude:
          type: number
          format: double
        from_longitude:
          type: number
          format: double
        to_latitude:
          type: number
          format: double
        to_longitude:
          type: number
          format: double
        from_address:
          type: string
          description: Departure address
        to_address:
          type: string
          description: Arrival address
        distance:
          type: integer
          description: Distance in km
          example: 25
        duration:
          type: integer
          description: Duration in minutes
          example: 45
        departure_ts:
          type: string
          format: date-time
        seats_available:
          type: integer
          example: 3
        price:
          $ref: '#/components/schemas/PriceInfo'
        max_two_back:
          type: boolean
          description: Max 2 passengers can sit in back
        conditioner:
          type: boolean
          description: Air conditioning available
          example: true
        smoking_allowed:
          type: boolean
          description: Smoking is allowed in the car
          example: false
        door_pickup:
          type: boolean
          description: Door-to-door pickup service
          example: true
        food_stop:
          type: boolean
          description: Food stops allowed during trip
          example: false
        garage:
          $ref: '#/components/schemas/GarageStatus'
        parcels_allowed:
          type: boolean
          description: Driver accepts parcel delivery on this trip
          example: false
        parcel_price:
          type: number
          format: double
          nullable: true
          description: Price per parcel; null means price_per_person is used
          example: 40000
        booking_type:
          $ref: '#/components/schemas/BookingType'
          description: |
            Type of booking for this trip:
            - INSTANT: Passengers are confirmed immediately upon booking
            - REQUEST: Passengers must wait for driver approval (status PENDING)
        comment:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TripStatus'
        driver:
          $ref: '#/components/schemas/User'
        car:
          $ref: '#/components/schemas/Car'
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        trip_start_ts:
          type: string
          format: date-time
          nullable: true
        trip_end_ts:
          type: string
          format: date-time
          nullable: true

    # =============== BOOKING SCHEMA ===============
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        passengerId:
          type: string
          format: uuid
        seatsBooked:
          type: integer
          example: 2
        totalPrice:
          type: number
          format: double
          example: 110000
        status:
          $ref: '#/components/schemas/BookingStatus'
        pickup_location:
          type: object
          description: Formatted pickup location (returned by API)
          properties:
            city:
              type: string
            address:
              type: string
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
        dropoff_location:
          type: object
          description: Formatted dropoff location (returned by API)
          properties:
            city:
              type: string
            address:
              type: string
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
        cancellationReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =============== PARCEL SCHEMA (MVP) ===============
    ParcelStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, CANCELLED, PICKED_UP, DELIVERED]
      description: |
        Parcel delivery status:
        - PENDING: waiting for driver approval (REQUEST trips only)
        - CONFIRMED: driver agreed to deliver (immediately on INSTANT trips)
        - REJECTED: driver declined the request
        - CANCELLED: cancelled by sender or by trip cancellation
        - PICKED_UP: driver picked the parcel up from the sender
        - DELIVERED: parcel handed to the recipient

    Parcel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        price:
          type: number
          format: double
          example: 40000
        status:
          $ref: '#/components/schemas/ParcelStatus'
        pickup_location:
          type: object
          description: Where the driver picks the parcel up
          properties:
            city:
              type: string
            address:
              type: string
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
        dropoff_location:
          type: object
          description: Where the parcel is handed to the recipient
          properties:
            city:
              type: string
            address:
              type: string
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
        cancellation_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # =============== PAYMENT & TRANSACTION SCHEMA ===============
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: number
          format: double
          example: 50000
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type: string
        relatedEntityId:
          type: string
          format: uuid
          nullable: true
        relatedEntityType:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        providerTransactionId:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        balance:
          type: number
          format: double
          example: 250000
        currency:
          type: string
          example: UZS
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # =============== CHAT SCHEMA ===============
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        content:
          type: string
        mediaUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Chat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        participant1Id:
          type: string
          format: uuid
        participant2Id:
          type: string
          format: uuid
        isBlocked:
          type: boolean
          description: Indicates if the other participant is blocked by the current user
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    # =============== RATING SCHEMA ===============
    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        ratedUserId:
          type: string
          format: uuid
        ratingUserId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        feedback:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # =============== NOTIFICATION SCHEMA ===============
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [trips, newsAndAgreement, promotionAndDiscounts, messages, general]
        title:
          type: string
        body:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # =============== REGION SCHEMA ===============
    Region:
      type: object
      properties:
        id:
          type: integer
        nameRu:
          type: string
        nameUz:
          type: string
        nameOz:
          type: string
          nullable: true
        nameEn:
          type: string
          nullable: true

  requestBodies:
    PhoneNumber:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phoneNumber]
            properties:
              phoneNumber:
                type: string
                pattern: '^\+998[0-9]{9}$'
                example: '+998901234567'

    VerifyOtp:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phoneNumber, otp]
            properties:
              phoneNumber:
                type: string
                pattern: '^\+998[0-9]{9}$'
                example: '+998901234567'
              otp:
                type: string
                example: '0000'

    CompleteProfile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - userId
              - firstName
            properties:
              userId:
                type: string
                format: uuid
                description: User ID from step 2
              firstName:
                type: string
                minLength: 1
                maxLength: 32
                description: User's first name
              avatar:
                type: string
                format: binary
                description: User avatar image (JPEG, PNG, WEBP, max 5MB)
              referralCode:
                type: string
                minLength: 3
                maxLength: 20
                description: Optional referral code

    UpdateProfile:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              firstName:
                type: string
                maxLength: 32
              lastName:
                type: string
                maxLength: 32
                nullable: true
              bio:
                type: string
                maxLength: 128
                nullable: true
              gender:
                $ref: '#/components/schemas/Gender'
              date_of__birthday:
                type: string
                format: date
              talkative:
                type: boolean
                description: User prefers talkative drivers/passengers
              music_allowed:
                type: boolean
                description: User is okay with music during trip
              pets_allowed:
                type: boolean
                description: User prefers trips that allow pets
              preferred_navigator:
                $ref: '#/components/schemas/NavigatorPreference'
                description: Preferred navigation app
              notificationPreferences:
                type: object
                properties:
                  trips:
                    type: boolean
                  newsAndAgreement:
                    type: boolean
                  promotionAndDiscounts:
                    type: boolean
                  messages:
                    type: boolean
                  general:
                    type: boolean

    CreateTrip:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - car_id
              - from_latitude
              - from_longitude
              - to_latitude
              - to_longitude
              - departure_ts
              - seats_available
              - price_per_person
            properties:
              car_id:
                type: string
                format: uuid
              from_latitude:
                type: number
                format: double
                example: 41.2995
              from_longitude:
                type: number
                format: double
                example: 69.2401
              to_latitude:
                type: number
                format: double
                example: 40.7580
              to_longitude:
                type: number
                format: double
                example: 72.2997
              distance:
                type: number
                format: double
                nullable: true
                description: Distance in km
              duration:
                type: number
                format: double
                nullable: true
                description: Duration in minutes
              departure_ts:
                type: string
                format: date-time
                example: '2024-12-20T14:30:00Z'
              seats_available:
                type: integer
                minimum: 1
                example: 4
              price_per_person:
                type: number
                format: double
                example: 50000
              max_two_back:
                type: boolean
                default: false
                description: Maximum 2 passengers in back seat
              conditioner:
                type: boolean
                default: false
                description: Air conditioning available in the car
              smoking_allowed:
                type: boolean
                default: false
                description: Smoking allowed during the trip
              door_pickup:
                type: boolean
                default: false
                description: Door-to-door pickup service
              food_stop:
                type: boolean
                default: false
                description: Food stops allowed during trip
              garage:
                type: string
                enum: [FULL, EMPTY, HALF_EMPTY]
                default: EMPTY
                description: Garage/trunk space availability
              parcels_allowed:
                type: boolean
                default: false
                description: Driver accepts parcel delivery on this trip
              parcel_price:
                type: number
                nullable: true
                description: Price per parcel; if omitted, price_per_person is used
              booking_type:
                type: string
                enum: [INSTANT, REQUEST]
                default: INSTANT
                description: 'Booking confirmation type: INSTANT - automatic booking, REQUEST - requires driver approval'
              comment:
                type: string
                maxLength: 255
                nullable: true

    CreateBooking:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - tripId
              - pickup_latitude
              - pickup_longitude
              - dropoff_latitude
              - dropoff_longitude
              - seatsBooked
            properties:
              tripId:
                type: string
                format: uuid
                description: ID of the trip to book
              pickup_latitude:
                type: number
                format: double
                description: Pickup point latitude
                example: 41.2995
              pickup_longitude:
                type: number
                format: double
                description: Pickup point longitude
                example: 69.2401
              dropoff_latitude:
                type: number
                format: double
                description: Dropoff point latitude
                example: 40.7580
              dropoff_longitude:
                type: number
                format: double
                description: Dropoff point longitude
                example: 72.2997
              seatsBooked:
                type: integer
                minimum: 1
                example: 2
                description: Number of seats to book

    CreateParcel:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - tripId
              - pickup_latitude
              - pickup_longitude
              - dropoff_latitude
              - dropoff_longitude
            properties:
              tripId:
                type: string
                format: uuid
                description: ID of the trip (must have parcels_allowed = true)
              pickup_latitude:
                type: number
                format: double
                description: Point A latitude — where the driver picks the parcel up
                example: 41.2995
              pickup_longitude:
                type: number
                format: double
                description: Point A longitude — where the driver picks the parcel up
                example: 69.2401
              dropoff_latitude:
                type: number
                format: double
                description: Point B latitude — where the parcel is dropped off
                example: 39.6517
              dropoff_longitude:
                type: number
                format: double
                description: Point B longitude — where the parcel is dropped off
                example: 66.9513

    PayForBookingWithCard:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [bookingId, userCardId]
            properties:
              bookingId:
                type: string
                format: uuid
              userCardId:
                type: string
                format: uuid

    StartChat:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tripId, participant2Id]
            properties:
              tripId:
                type: string
                format: uuid
              participant2Id:
                type: string
                format: uuid
                description: ID of the second participant

    SendMessage:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              content:
                type: string
              mediaUrl:
                type: string
                nullable: true

    CreateRating:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tripId, ratedUserId, rating]
            properties:
              tripId:
                type: string
                format: uuid
              ratedUserId:
                type: string
                format: uuid
              rating:
                type: integer
                minimum: 1
                maximum: 5
              feedback:
                type: string
                nullable: true

  responses:
    Success:
      description: Operation successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'

    CreatedSuccess:
      description: Resource created successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'

    BadRequest:
      description: Bad request - dto error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized - missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Conflict - resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'healthy'

  # ===================== AUTH ENDPOINTS =====================
  /auth/guest:
    post:
      tags: [Auth]
      summary: Create or get guest user
      description: |
        Create a new guest user or return existing guest user by guestId and fcmToken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - guestId
                - fcmToken
              properties:
                guestId:
                  type: string
                  description: Unique guest user ID (UUID or random string)
                fcmToken:
                  type: string
                  description: FCM token for push notifications
            example:
              guestId: "123e4567-e89b-12d3-a456-426614174000"
              fcmToken: "fcm_token_example"
      responses:
        '200':
          description: Guest user created or fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  guestId:
                    type: string
                  firstName:
                    type: string
              example:
                guestId: "123e4567-e89b-12d3-a456-426614174000"
                firstName: "Guest"
  /auth/request-otp:
    post:
      tags: [Auth]
      summary: Request OTP
      description: Request OTP for login or registration. Optionally accepts guestId to link guest user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
              properties:
                phoneNumber:
                  type: string
                  description: Phone number in format +998XXXXXXXXX
                  example: "+998901234567"
                guestId:
                  type: string
                  format: uuid
                  description: Optional guest user ID to link guest with real user
            example:
              phoneNumber: "+998901234567"
              guestId: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User already verified
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP
      description: Verify OTP and proceed with login or registration
      requestBody:
        $ref: '#/components/requestBodies/VerifyOtp'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Login response
                    properties:
                      success:
                        type: boolean
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          expiresIn:
                            type: number
                          user:
                            $ref: '#/components/schemas/User'
                      message:
                        type: string
                  - type: object
                    description: Continue registration response
                    properties:
                      success:
                        type: boolean
                      data:
                        type: object
                        properties:
                          userId:
                            type: string
                            format: uuid
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/complete-profile:
    post:
      tags: [Auth]
      summary: Complete profile (registration step 3)
      description: |
        Complete user profile after OTP verification.
        Upload avatar image (optional) and provide user details.
        Supported image formats: JPEG, PNG, WEBP (max 5MB)
      requestBody:
        $ref: '#/components/requestBodies/CompleteProfile'
      responses:
        '201':
          description: Registration completed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          expiresIn:
                            type: integer
                          user:
                            $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      expiresIn:
                        type: number
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===================== USER ENDPOINTS =====================
