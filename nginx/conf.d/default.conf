upstream yoldosh_service {
    server yoldosh-service:5000;
}

upstream grafana_service {
    server grafana:3000;
}

# ================= API =================
server {
    listen 80;
    server_name api.yoldosh.uz;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.yoldosh.uz;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/api.yoldosh.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yoldosh.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://yoldosh_service;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
    }

    location /grafana/ {
        proxy_pass http://grafana_service/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
    }
}
# tg-parser dashboard (ai.yoldosh.uz)
# Дашборд живёт в ДРУГОМ compose-стеке (tg_parser). Контейнер
# tg-parser-dashboard подключён к этой же docker-сети, поэтому резолвится
# по имени через встроенный DNS Docker (127.0.0.11).
server {
    listen 80;
    server_name ai.yoldosh.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ai.yoldosh.uz;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/ai.yoldosh.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.yoldosh.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Resolver + переменная в proxy_pass: имя пере-резолвится в рантайме.
    # Без этого `docker compose up -d --build` в стеке tg_parser даёт новый IP
    # контейнеру, а nginx держит старый и отдаёт 502 до перезагрузки.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tg_dashboard http://tg-parser-dashboard:8080;

    # SSE-стримы логов (/api/logs/stream и т.п.) требуют выключенной буферизации,
    # иначе строки копятся в nginx и приходят пачками.
    proxy_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 86400;

    # У самого дашборда авторизации нет, а POST /api/restart/{service} ходит
    # в docker.sock. Поэтому UI и API закрыты basic-auth.
    auth_basic "yoldosh ai";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    # Клик-редирект из рассылок — должен остаться публичным.
    location /go/ {
        auth_basic off;
        proxy_pass $tg_dashboard;
    }

    # WebSocket живых обновлений. Basic-auth здесь выключен намеренно:
    # браузеры не гарантируют отправку сохранённых credentials в WS-handshake.
    # Через сокет уходит только read-only статистика.
    location /ws/ {
        auth_basic off;
        proxy_pass $tg_dashboard;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass $tg_dashboard;
    }
}

