[server]
enable_gzip = true
protocol = http
http_port = 3000

[users]
default_theme = dark

[paths]
provisioning = /etc/grafana/provisioning

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
level = warn
mode = console

[metrics]
enabled = false

[alerting]
enabled = false

[unified_alerting]
enabled = true

[feature_toggles]
enable = tempoSearch tempoBackendSearch

[database]
# Use SQLite for MVP (low resource usage)
type = sqlite3
wal = true

[auth.anonymous]
enabled = true
org_role = Admin