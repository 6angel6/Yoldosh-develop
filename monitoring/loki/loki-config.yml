auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Limits and performance tuning
limits_config:
  # Disable structured metadata for better performance
  allow_structured_metadata: false
  # Ingestion limits (optimized for MVP)
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_streams_per_user: 0
  max_global_streams_per_user: 5000
  # Query limits
  max_query_series: 500
  max_query_lookback: 720h
  max_entries_limit_per_query: 5000
  # Дробление запроса диапазона на под-запросы. Дефолт 30m давал сотни
  # под-запросов на широком окне (сутки = 48, 7 дней = 336) → очередь
  # query-frontend переполнялась: "too many outstanding requests".
  # 24h снижает число под-запросов до единиц.
  split_queries_by_interval: 24h
  # Потолок параллельных под-запросов на один запрос (дефолт 14). При лимите
  # 400M / 0.4 CPU держим умеренно, чтобы не ловить OOM.
  max_query_parallelism: 8
  # Retention
  retention_period: 168h  # 7 days

# Query optimization
query_range:
  # Выравнивать границы под-запросов по step → повторные рефреши дашбордов
  # попадают в кэш (иначе каждый рефреш — новый диапазон, промах кэша).
  align_queries_with_step: true
  cache_results: true
  max_retries: 5
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Query-frontend: очередь под-запросов на тенанта. Дефолт мал для дашбордов
# с несколькими панелями за широкий диапазон → "too many outstanding requests".
frontend:
  max_outstanding_per_tenant: 4096
  compress_responses: true
  log_queries_longer_than: 10s

# Compactor for better performance
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  enable_alertmanager_v2: true

# Frontend worker for query parallelization
frontend_worker:
  match_max_concurrent: true

# Table manager settings
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h
