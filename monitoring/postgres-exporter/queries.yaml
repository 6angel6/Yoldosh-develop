# Custom PostgreSQL queries for BlaBlaCar-like metrics
pg_replication:
  query: |
    SELECT
      CASE WHEN pg_is_in_recovery() THEN 1 ELSE 0 END as is_replica,
      EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))::float as lag_seconds
  metrics:
    - is_replica:
        usage: "GAUGE"
        description: "1 if replica, 0 if primary"
    - lag_seconds:
        usage: "GAUGE"
        description: "Replication lag in seconds"

pg_database_size:
  query: |
    SELECT
      datname as database,
      pg_database_size(datname) as size_bytes
    FROM pg_database
    WHERE datname NOT IN ('template0', 'template1', 'postgres')
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - size_bytes:
        usage: "GAUGE"
        description: "Database size in bytes"

pg_table_size:
  query: |
    SELECT
      schemaname as schema,
      tablename as table,
      pg_total_relation_size(quote_ident(schemaname)||'.'||quote_ident(tablename)) as size_bytes
    FROM pg_tables
    WHERE schemaname = 'public'
      AND EXISTS (
        SELECT 1 FROM pg_class c
        JOIN pg_namespace n ON n.oid = c.relnamespace
        WHERE n.nspname = schemaname
          AND c.relname = tablename
      )
    ORDER BY size_bytes DESC
    LIMIT 20
  metrics:
    - schema:
        usage: "LABEL"
        description: "Schema name"
    - table:
        usage: "LABEL"
        description: "Table name"
    - size_bytes:
        usage: "GAUGE"
        description: "Table size in bytes"

pg_slow_queries:
  query: |
    SELECT
      COUNT(*) as slow_queries_count
    FROM pg_stat_activity
    WHERE state = 'active'
      AND query_start < now() - interval '5 seconds'
      AND query NOT LIKE '%pg_stat_activity%'
  metrics:
    - slow_queries_count:
        usage: "GAUGE"
        description: "Number of queries running longer than 5 seconds"

pg_locks_count:
  query: |
    SELECT
      mode,
      COUNT(*) as locks_count
    FROM pg_locks
    WHERE granted = true
    GROUP BY mode
  metrics:
    - mode:
        usage: "LABEL"
        description: "Lock mode"
    - locks_count:
        usage: "GAUGE"
        description: "Number of locks"

pg_active_connections_by_state:
  query: |
    SELECT
      state,
      COUNT(*) as connections_count
    FROM pg_stat_activity
    WHERE state IS NOT NULL
    GROUP BY state
  metrics:
    - state:
        usage: "LABEL"
        description: "Connection state"
    - connections_count:
        usage: "GAUGE"
        description: "Number of connections"

pg_cache_hit_ratio:
  query: |
    SELECT
      datname as database,
      CASE
        WHEN (blks_hit + blks_read) = 0 THEN 0
        ELSE (blks_hit::float / (blks_hit + blks_read))
      END as cache_hit_ratio
    FROM pg_stat_database
    WHERE datname NOT IN ('template0', 'template1')
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - cache_hit_ratio:
        usage: "GAUGE"
        description: "Cache hit ratio (0-1)"

pg_deadlocks:
  query: |
    SELECT
      datname as database,
      deadlocks
    FROM pg_stat_database
    WHERE datname NOT IN ('template0', 'template1', 'postgres')
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - deadlocks:
        usage: "COUNTER"
        description: "Number of deadlocks detected"

pg_temp_files:
  query: |
    SELECT
      datname as database,
      temp_files,
      temp_bytes
    FROM pg_stat_database
    WHERE datname NOT IN ('template0', 'template1', 'postgres')
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - temp_files:
        usage: "COUNTER"
        description: "Number of temporary files created"
    - temp_bytes:
        usage: "COUNTER"
        description: "Temporary file bytes written"

pg_transaction_wraparound:
  query: |
    SELECT
      datname as database,
      age(datfrozenxid) as xid_age,
      2147483647 - age(datfrozenxid) as xids_until_wraparound
    FROM pg_database
    WHERE datname NOT IN ('template0', 'template1')
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - xid_age:
        usage: "GAUGE"
        description: "Transaction ID age"
    - xids_until_wraparound:
        usage: "GAUGE"
        description: "Transactions until wraparound"

pg_checkpointer:
  query: "SELECT checkpoints_timed, checkpoints_req, checkpoint_write_time, checkpoint_sync_time, buffers_checkpoint FROM pg_stat_checkpointer"
  metrics:
    - checkpoints_timed:
        usage: "COUNTER"
        description: "Scheduled checkpoints"
    - checkpoints_req:
        usage: "COUNTER"
        description: "Requested checkpoints"
    - checkpoint_write_time:
        usage: "COUNTER"
        description: "Checkpoint write time (ms)"
    - checkpoint_sync_time:
        usage: "COUNTER"
        description: "Checkpoint sync time (ms)"
    - buffers_checkpoint:
        usage: "COUNTER"
        description: "Buffers written during checkpoints"